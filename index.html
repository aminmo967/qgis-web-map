        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

// 📍 موقعیت فعلی کاربر

var userLocationMarker = null;

var locationButton = L.control({
    position: 'topleft'
});

locationButton.onAdd = function(map) {

    var div = L.DomUtil.create(
        'div',
        'leaflet-bar leaflet-control'
    );

    div.style.background = 'white';
    div.style.borderRadius = '6px';
    div.style.overflow = 'hidden';

    div.innerHTML =
        '<button id="myLocationButton" ' +
        'style="display:block;width:140px;height:42px;' +
        'border:0;background:white;cursor:pointer;' +
        'font-size:14px;">' +
        '📍 موقعیت من' +
        '</button>';

    L.DomEvent.disableClickPropagation(div);

    return div;
};

locationButton.addTo(map);


// ==========================================
// 📍 دریافت موقعیت
// ==========================================

document.getElementById('myLocationButton').onclick = function() {

    map.locate({
        setView: true,
        maxZoom: 18,
        enableHighAccuracy: true
    });

};


// ==========================================
// پیدا شدن موقعیت
// ==========================================

map.on('locationfound', function(e) {

    map._userLocation = e.latlng;

    if (userLocationMarker) {
        map.removeLayer(userLocationMarker);
    }

    userLocationMarker = L.marker(e.latlng)
        .addTo(map)
        .bindPopup('📍 موقعیت فعلی شما')
        .openPopup();

});

});

var routeLayer = null;
var destinationMarker = null;

var routingControl = L.control({
    position: 'topleft'
});

routingControl.onAdd = function(map) {

    var div = L.DomUtil.create(
        'div',

    div.style.marginTop = '5px';

        '🚗 مسیر خودرو' +
        '</button>' +

        'cursor:pointer;font-size:14px;">' +

    return div;
};

routingControl.addTo(map);


// ==========================================
// 🚗🚶 تابع مسیریابی
// ==========================================

function startRouting(mode) {

    if (!map._userLocation) {

        alert(
            'ابتدا روی «📍 موقعیت من» بزنید.'
        );

        return;
    }

    alert(
        'حالا روی مقصد موردنظر در نقشه کلیک کنید.'
    );

    map.once('click', function(e) {

        var start = map._userLocation;
        var end = e.latlng;


        // حذف مسیر قبلی

        if (routeLayer) {

            map.removeLayer(routeLayer);

            routeLayer = null;
        }


        // حذف مقصد قبلی

        if (destinationMarker) {

            map.removeLayer(destinationMarker);

            destinationMarker = null;
        }


        // نمایش مقصد

        destinationMarker = L.marker(end)
            .addTo(map)
            .bindPopup(
                mode === 'driving'
                ? '🎯 مقصد خودرو'
                : '🎯 مقصد پیاده'
            )
            .openPopup();


        var profile;
        var server;


        // خودرو

        if (mode === 'driving') {

            profile = 'driving';

            server =
                'https://routing.openstreetmap.de/routed-car';

        }


        // پیاده

        else {

            profile = 'foot';

            server =
                'https://routing.openstreetmap.de/routed-foot';

        }


        // ساخت URL

        var url =
            server +
            '/route/v1/' +
            profile +
            '/' +
            start.lng + ',' + start.lat +
            ';' +
            end.lng + ',' + end.lat +
            '?overview=full&geometries=geojson';


        // دریافت مسیر

        fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    'HTTP ' + response.status
                );

            }

            return response.json();

        })

        .then(function(data) {

            if (
                !data.routes ||
                data.routes.length === 0
            ) {

                alert('مسیر پیدا نشد.');

                return;
            }


            var route = data.routes[0];


            // رسم مسیر

            routeLayer = L.geoJSON(
                route.geometry,
                {
                    style: {
                        weight: 6
                    }
                }
            ).addTo(map);


            // نمایش کل مسیر

            map.fitBounds(
                routeLayer.getBounds(),
                {
                    padding: [40, 40]
                }
            );


            // فاصله

            var distance =
                (route.distance / 1000).toFixed(2);


            // زمان

            var duration =
                Math.round(
                    route.duration / 60
                );


            var modeName =
                mode === 'driving'
                ? '🚗 خودرو'
                : '🚶 پیاده';


            alert(
                modeName +
                ' - مسیر پیدا شد\n\n' +

                '📏 فاصله: ' +
                distance +
                ' کیلومتر\n' +

                '⏱ زمان تقریبی: ' +
                duration +
                ' دقیقه'
            );

        })

        .catch(function(error) {

            console.log(error);

            alert(
                'خطا در دریافت مسیر.\n\n' +
                'اتصال اینترنت را بررسی کنید.'
            );

        });

    });

}


// ==========================================
// 🚗 مسیر خودرو
// ==========================================

document.getElementById(
    'carRouteButton'
).onclick = function() {

    startRouting('driving');

};
// ==========================================
// 🚶 مسیر پیاده
// ==========================================

document.getElementById(

    startRouting('foot');

};
